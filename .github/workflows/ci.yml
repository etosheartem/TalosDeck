name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
      - run: go test ./... && go vet ./...
      - run: go test -race ./internal/auth ./internal/clusters ./internal/jobs ./internal/operations ./internal/api
      - run: docker build -t talosdeck:ci .
